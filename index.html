<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groopit - התחברות</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      direction: rtl;
      background: url('6b1ea654-930b-4225-8228-110a788ee739.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
    }
    .container {
      padding: 50px;
      background-color: rgba(0, 0, 0, 0.6);
      max-width: 500px;
      margin: auto;
      margin-top: 10vh;
      border-radius: 15px;
    }
    h1, h2 {
      color: #ffdd57;
    }
    input[type="email"], input[type="password"] {
      padding: 12px;
      width: 90%;
      margin: 10px auto;
      display: block;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1em;
    }
    button {
      padding: 12px 30px;
      font-size: 1.1em;
      background: #ffdd57;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #ffe88f;
    }
    #status, #login-status {
      margin-top: 20px;
      font-weight: bold;
      color: #aaffaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>התחברות למשתמש קיים</h2>
    <label for="login-email">אימייל:</label>
    <input type="email" id="login-email" placeholder="example@gmail.com">

    <label for="login-password">סיסמה:</label>
    <input type="password" id="login-password" placeholder="הקלד סיסמה">

    <button onclick="logIn()">התחבר</button>
    <p id="login-status"></p>

    <hr><br>
    <h1>הרשמה ל־Groopit</h1>
    <label for="email">אימייל:</label>
    <input type="email" id="email" placeholder="example@gmail.com">

    <label for="password">סיסמה:</label>
    <input type="password" id="password" placeholder="הקלד סיסמה">

    <button onclick="signUp()">הירשם</button>
    <p id="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJgKR4sLl9-TP9ralxMFy-_mJcNEsryX0",
      authDomain: "groopit-fc12a.firebaseapp.com",
      projectId: "groopit-fc12a",
      storageBucket: "groopit-fc12a.appspot.com",
      messagingSenderId: "321458941138",
      appId: "1:321458941138:web:2d6f8be69420a59d63110b",
      measurementId: "G-CT2LZZGMSY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signUp = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        status.innerText = "נרשמת בהצלחה!";
        window.location.href = "home.html";
      } catch (error) {
        status.innerText = "שגיאה: " + error.message;
      }
    }

    window.logIn = async function () {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const status = document.getElementById("login-status");
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        status.innerText = "התחברת בהצלחה!";
        window.location.href = "home.html";
      } catch (error) {
        status.innerText = "שגיאה: " + error.message;
      }
    }
  </script>
</body>
</html>
