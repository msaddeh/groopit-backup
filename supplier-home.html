<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groopit - ספק</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      direction: rtl;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #4a90e2;
      padding: 20px;
      color: white;
      text-align: center;
      font-size: 24px;
    }
    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ABD;
    }
    .product-entry {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background: white;
    }
    h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    ספק - Groopit
  </header>
  <div class="container">
    <h3>הצהר על מוצר שאתה מוכר</h3>
    <div id="productsContainer">
      <div class="product-entry">
        <input type="text" placeholder="מה אתה מוכר?" class="product-name">
        <input type="number" placeholder="בכמה?" class="product-price">
      </div>
    </div>
    <button onclick="addProductEntry()">+</button>
    <button onclick="submitProducts()">שמור</button>

    <hr>
    <button onclick="showRelevantGroups()">הצג קבוצות חמות שמתאימות לי</button>
    <div id="relevantGroups"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, updateDoc, doc, setDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJgKR4sLl9-TP9ralxMFy-_mJcNEsryX0",
      authDomain: "groopit-fc12a.firebaseapp.com",
      projectId: "groopit-fc12a",
      storageBucket: "groopit-fc12a.appspot.com",
      messagingSenderId: "321458941138",
      appId: "1:321458941138:web:2d6f8be69420a59d63110b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();
    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
      }
    });

    window.addProductEntry = () => {
      const container = document.getElementById("productsContainer");
      const entry = document.createElement("div");
      entry.className = "product-entry";
      entry.innerHTML = `
        <input type="text" placeholder="מה אתה מוכר?" class="product-name">
        <input type="number" placeholder="בכמה?" class="product-price">
      `;
      container.appendChild(entry);
    };

    window.submitProducts = async () => {
      const names = document.querySelectorAll(".product-name");
      const prices = document.querySelectorAll(".product-price");
      const products = [];
      names.forEach((el, idx) => {
        if (el.value && prices[idx].value) {
          products.push({ name: el.value.toLowerCase(), price: prices[idx].value });
        }
      });
      if (products.length > 0 && currentUser) {
        await setDoc(doc(db, "suppliers", currentUser.uid), {
          products
        }, { merge: true });

        // הוספת המחיר גם לקבוצות הרלוונטיות
        for (const prod of products) {
          const q = query(collection(db, "groups"), where("name", "==", prod.name));
          const snapshot = await getDocs(q);
          snapshot.forEach(async (docSnap) => {
            const groupRef = doc(db, "groups", docSnap.id);
            const groupData = docSnap.data();
            const offers = groupData.offers || [];
            offers.push({ price: prod.price, supplier: currentUser.uid, createdAt: new Date() });
            await updateDoc(groupRef, { offers });
          });
        }

        alert("נשמר בהצלחה");
      }
    };

    window.showRelevantGroups = async () => {
      const container = document.getElementById("relevantGroups");
      container.innerHTML = "";
      const supplierDoc = await getDoc(doc(db, "suppliers", currentUser.uid));
      if (!supplierDoc.exists()) return;
      const myProducts = supplierDoc.data().products || [];
      for (const prod of myProducts) {
        const q = query(collection(db, "groups"), where("name", "==", prod.name));
        const snapshot = await getDocs(q);
        snapshot.forEach(docSnap => {
          const group = docSnap.data();
          const div = document.createElement("div");
          div.className = "group-card";
          div.innerHTML = `<h4>${group.name}</h4><p>משתתפים: ${group.membersCount || 0}</p>`;
          container.appendChild(div);
        });
      }
    }
  </script>
</body>
</html>
